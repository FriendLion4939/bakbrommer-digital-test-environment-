name: City stop-and-go
description: Six short blocks with traffic-light stops, a right and a left turn, 25-35 km/h. Shows consumption in town and how much braking energy is recovered.
category: energy
route:
  - {type: straight, length_m: 90, speed_kmh: 35}
  - {type: straight, length_m: 70, speed_kmh: 30, stop_s: 6}
  - {type: arc, radius_m: 8, angle_deg: -90, speed_kmh: 30}
  - {type: straight, length_m: 110, speed_kmh: 35}
  - {type: straight, length_m: 80, speed_kmh: 25, stop_s: 4}
  - {type: arc, radius_m: 10, angle_deg: 90, speed_kmh: 25}
  - {type: straight, length_m: 100, speed_kmh: 35, stop_s: 5}
  - {type: straight, length_m: 60, speed_kmh: 30, stop_s: 3}
end: {time_limit_s: 240}
metrics:
  - {type: finish_time}
