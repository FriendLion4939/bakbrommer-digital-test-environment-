home:
  intro: >-
    A driving simulator for the hybrid cargo moped. Describe the vehicle with
    parameters, pick a ride, press run, and see speed, wheel loads, wheel lift,
    battery current and everything else - before trying it on the road.
  profile: Vehicle profile in use
  scenarios: Scenarios
  saved_runs: Saved runs
  to_measure: Values still to measure
  steps_title: How to use it
  steps: |
    1. **Parameters** - check the vehicle profile. Start with masses, positions and heights; they decide wheel lift.
    2. **Scenarios** - look at the built-in rides or make your own.
    3. **Run a simulation** - pick a scenario and press *Run*. Every run is saved.
    4. **Results and comparison** - open saved runs, tick two or more to compare them.
    5. **Sweeps and optimiser** - try many values at once, or let the program search controller settings.
  measure_title: What to measure first
  measure: |
    * Total weight and the weight on each wheel (three bathroom scales) - gives the centre of gravity position.
    * Height of the centre of gravity (weigh the rear wheel with the front raised).
    * Track width, wheelbase, wheel radii.
    * BMS and motor controller current limits as actually set.
